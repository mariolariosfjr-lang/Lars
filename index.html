<!DOCTYPE html>
<html>
<head>
  <title>LARS Vehicles</title>

  <style>
    body {
      margin: 0;
      background: red;
      font-family: "Segoe UI", sans-serif;
      color: white;
    }

    header {
      background: #980000;
      padding: 30px;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 999;
    }

    h1 {
      margin: 0;
      font-size: 50px;
    }

    .garage {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 14px;
      padding: 20px;
    }

    .car {
      width: 220px;
      background: rgba(255,255,255,0.12);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 5px 14px rgba(0,0,0,0.35);
      transition: 0.2s;
      backdrop-filter: blur(4px);
    }

    .car:hover {
      transform: scale(1.03);
    }

    .car img {
      width: 100%;
      height: 140px;
      object-fit: cover;
      display: block;
    }

    .content {
      padding: 14px;
    }

    h2 {
      margin-top: 0;
    }

    button {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      background: white;
      color: red;
      font-family: "Segoe UI";
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #ffd0d0;
    }

    #counter {
      margin-top: 10px;
      font-size: 20px;
    }

    footer {
      background: #7a0000;
      text-align: center;
      padding: 30px;
      margin-top: 30px;
    }
  </style>
</head>

<body>

<header>
  <h1>LARS VEHICLES</h1>
  <p>Official Lars electric vehicle marketplace.</p>
  <div id="counter">Cars Bought: 0</div>
</header>

<div class="garage" id="garage"></div>

<footer>
  © 2026 Lars Vehicles
</footer>

<script>
  let bought = 0;

  function buyCar(name) {
    bought++;

    document.getElementById("counter").innerText =
      "Cars Bought: " + bought;

    alert("You bought: " + name);
  }

  const garage = document.getElementById("garage");

  /*
    REAL IMG SRC SYSTEM
    OVER 10,000 HTML ELEMENTS GENERATED
  */

  const carImages = [
    "https://images.unsplash.com/photo-1503376780353-7e6692767b70",
    "https://images.unsplash.com/photo-1492144534655-ae79c964c9d7",
    "https://images.unsplash.com/photo-1553440569-bcc63803a83d",
    "https://images.unsplash.com/photo-1544636331-e26879cd4d9b",
    "https://images.unsplash.com/photo-1502877338535-766e1452684a"
  ];

  for (let i = 1; i <= 2000; i++) {

    const card = document.createElement("div");
    card.className = "car";

    const img = document.createElement("img");

    img.src =
      carImages[i % carImages.length] +
      "?auto=format&fit=crop&w=600&q=80";

    const content = document.createElement("div");
    content.className = "content";

    const title = document.createElement("h2");
    title.innerText = "Lars EV #" + i;

    const desc = document.createElement("p");
    desc.innerText =
      "Premium Lars electric vehicle model " + i;

    const price = document.createElement("p");
    price.innerHTML =
      "<b>$" + (45000 + i) + "</b>";

    const button = document.createElement("button");
    button.innerText = "Buy Lars Car";

    button.onclick = function () {
      buyCar("Lars EV #" + i);
    };

    content.appendChild(title);
    content.appendChild(desc);
    content.appendChild(price);
    content.appendChild(button);

    card.appendChild(img);
    card.appendChild(content);

    garage.appendChild(card);
  }
</script>

</body>
</html>
